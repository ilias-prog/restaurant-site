<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | The Lumin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script type="text/javascript"
        src="https://cdn.jsdelivr.net/npm/@emailjs/browser@5/dist/email.min.js">
</script>
<script src="script.js" defer></script>
</head>

<body>
    <section id="contact" class="contact-page">
        <section class="bg">
        <nav class="navbar navbar-expand-lg " id="navbar">
            <div class="container-fluid">
                <a href="home.html" aria-label="The Lumin - Home"><img src="images/lumin.png" class="mx-2 mx-lg-5"
                        alt="The Lumin" id="logo"></a>
                <button class="navbar-toggler " type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarTogglerDemo01" aria-controls="navbarTogglerDemo01" aria-expanded="false"
                    aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarTogglerDemo01">
                    <a class="navbar-brand nav-text" href="home.html">Home</a>
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link nav-text " aria-current="page" href="menu.html">Menu</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link nav-text" href="about.html">About us</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link nav-text active" href="contact.html">Contact</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </section>
    <form id="form-bg">
        <div class="contact-form">
            <div class="contact-form-intro">
                <span class="contact-eyebrow">WE'D LOVE TO HEAR FROM YOU</span>
                <h1>Get in touch</h1>
                <p>Questions, reservations, or a special request? Send us a message.</p>
            </div>
            <div class="contact-fields">
                <div class="contact-field">
                    <label for="name">Name</label>
                    <input type="text" name="name" id="name" placeholder="Your name" autocomplete="name" required>
                </div>
                <div class="contact-field">
                    <label for="email">Email</label>
                    <input type="email" name="email" id="email" placeholder="you@example.com" autocomplete="email" required>
                </div>
                <div class="contact-field contact-field-full">
                    <label for="subject">Subject</label>
                    <input type="text" name="subject" id="subject" placeholder="How can we help?">
                </div>
                <div class="contact-field contact-field-full">
                    <label for="message">Message</label>
                    <textarea name="message" id="message" placeholder="Write your message here..." rows="5" required></textarea>
                </div>
            </div>
            <button class="contact-submit" type="submit">Send message <span aria-hidden="true">→</span></button>
            <p id="form-status" role="status" aria-live="polite"></p>
        </div>
    </form>
  </section>  
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
